# Coder — Full-stack code writing agent
# No default provider: user must configure one in Settings → Providers
name: Coder
emoji: "🛠️"
role: coder
# No primary provider is pre-selected: pick one in Settings → Providers or the Agent Builder.
fallback_provider: openrouter  # cloud fallback when the primary is unavailable
prompts:
  - system/coder.md
tools:
  - read_file
  - write_file
  - edit_file
  - exec_command
  - list_files
  - search_files
  - web_search
  - web_fetch
  - provider_events
  - diary
  - project_memory
  - jev_ask
  - canvas
  - talk
  - agent_context
  - feed_card
  - set_timer
  - cancel_timer
  - read_tool_output
self_improvement:
  bug_journal: true
  project_rules: true
  enforcement: true
  structured_feedback: true
  dream_consolidation: true
