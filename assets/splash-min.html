<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevelCakes — Project Development Environment (minimal)</title>
<style>
  :root{
    --navy-900:#06060d;
    --navy-800:#0a0a14;
    --navy-700:#12121f;
    --indigo-400:#818cf8;
    --indigo-500:#6366f1;
    --indigo-600:#4f46e5;
    --indigo-200:#a5b4fc;
    --violet:#8b5cf6;
    --purple:#9c2eff;
    --purple-soft:#b45cff;
    --text:#e9e9f4;
    --muted:#8b8ba6;
    --ease:cubic-bezier(.22,1,.36,1);
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html,body{height:100%}

  body{
    background:var(--navy-900);
    color:var(--text);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:grid;
    place-items:center;
    overflow:hidden;
    position:relative;
    isolation:isolate;
  }

  /* ── Ambient background ─────────────────────────────────────────── */
  .glow{
    position:fixed;
    border-radius:50%;
    filter:blur(90px);
    pointer-events:none;
    z-index:0;
    opacity:0;
    animation:glow-in 2.4s var(--ease) forwards;
  }
  .glow-a{
    width:56vmax;height:56vmax;
    top:-22vmax;left:-16vmax;
    background:radial-gradient(circle at 50% 50%, rgba(99,102,241,.34), transparent 68%);
    animation-delay:.1s;
  }
  .glow-b{
    width:48vmax;height:48vmax;
    bottom:-18vmax;right:-12vmax;
    background:radial-gradient(circle at 50% 50%, rgba(156,46,255,.28), transparent 68%);
    animation-delay:.35s;
  }
  .glow-c{
    width:34vmax;height:34vmax;
    top:48%;left:52%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle at 50% 50%, rgba(79,70,229,.16), transparent 70%);
    animation-delay:.6s;
  }
  @keyframes glow-in{to{opacity:1}}

  #field{
    position:fixed;inset:0;
    z-index:1;
    pointer-events:none;
    opacity:0;
    animation:fade-in 2.2s var(--ease) .5s forwards;
  }

  /* Fine grid, masked to a soft vignette */
  .grid{
    position:fixed;inset:0;
    z-index:0;
    background-image:
      linear-gradient(rgba(129,140,248,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(129,140,248,.055) 1px, transparent 1px);
    background-size:56px 56px;
    -webkit-mask-image:radial-gradient(ellipse 62% 58% at 50% 46%, #000 12%, transparent 78%);
    mask-image:radial-gradient(ellipse 62% 58% at 50% 46%, #000 12%, transparent 78%);
    opacity:0;
    animation:fade-in 2.4s var(--ease) .3s forwards;
  }

  .vignette{
    position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(ellipse at 50% 50%, transparent 38%, rgba(6,6,13,.72) 100%);
  }

  /* ── Stage ──────────────────────────────────────────────────────── */
  .stage{
    position:relative;
    z-index:3;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:32px 24px;
    max-width:min(760px, 92vw);
  }

  /* Logo tile */
  .mark{
    position:relative;
    width:clamp(112px, 15vmin, 168px);
    height:clamp(112px, 15vmin, 168px);
    border-radius:30%;
    display:grid;
    place-items:center;
    opacity:0;
    transform:translateY(18px) scale(.9);
    animation:rise 1.1s var(--ease) .15s forwards;
  }
  .mark::before{
    content:"";
    position:absolute;
    inset:-30%;
    border-radius:50%;
    background:radial-gradient(circle at 50% 55%, rgba(156,46,255,.5), rgba(99,102,241,.18) 46%, transparent 70%);
    filter:blur(26px);
    z-index:-1;
    animation:breathe 6.5s ease-in-out infinite;
  }
  .mark::after{
    /* shimmer sweep */
    content:"";
    position:absolute;
    inset:0;
    border-radius:30%;
    background:linear-gradient(115deg, transparent 34%, rgba(255,255,255,.42) 50%, transparent 66%);
    background-size:280% 280%;
    mix-blend-mode:screen;
    animation:sweep 5.6s var(--ease) 1.6s infinite;
    pointer-events:none;
  }
  .mark img{
    width:100%;height:100%;
    display:block;
    border-radius:30%;
    box-shadow:
      0 0 0 1px rgba(255,255,255,.09),
      0 22px 60px -12px rgba(156,46,255,.55),
      0 8px 26px -8px rgba(0,0,0,.9);
    animation:float 7s ease-in-out .9s infinite;
    -webkit-user-drag:none;
    user-select:none;
  }
  @keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-9px)}
  }
  @keyframes breathe{
    0%,100%{opacity:.75;transform:scale(1)}
    50%{opacity:1;transform:scale(1.09)}
  }
  @keyframes sweep{
    0%{background-position:180% 0}
    45%,100%{background-position:-80% 0}
  }

  /* Wordmark */
  h1{
    margin-top:clamp(24px,4.4vmin,40px);
    font-size:clamp(40px,7.4vmin,76px);
    font-weight:800;
    letter-spacing:-.036em;
    line-height:1;
    display:flex;
    align-items:baseline;
    gap:.14em;
    opacity:0;
    transform:translateY(16px);
    animation:rise 1.15s var(--ease) .42s forwards;
  }
  h1 .thin{
    font-weight:300;
    color:var(--indigo-200);
    opacity:.92;
  }
  h1 .grad{
    background:linear-gradient(96deg,#c4b5fd 0%,#a5b4fc 26%,#818cf8 48%,#b45cff 72%,#9c2eff 100%);
    background-size:210% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:shift 9s ease-in-out infinite;
  }
  @keyframes shift{
    0%,100%{background-position:0% 0}
    50%{background-position:100% 0}
  }

  /* PDE badge */
  .badge{
    margin-top:clamp(14px,2.4vmin,20px);
    display:inline-flex;
    align-items:center;
    gap:9px;
    padding:7px 15px 7px 11px;
    border-radius:999px;
    border:1px solid rgba(129,140,248,.28);
    background:linear-gradient(180deg, rgba(99,102,241,.16), rgba(99,102,241,.06));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07), 0 10px 30px -18px rgba(99,102,241,.9);
    font-size:clamp(10px,1.5vmin,12px);
    font-weight:650;
    letter-spacing:.19em;
    text-transform:uppercase;
    color:var(--indigo-200);
    opacity:0;
    transform:translateY(14px);
    animation:rise 1.05s var(--ease) .62s forwards;
  }
  .badge .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--purple-soft);
    box-shadow:0 0 0 3px rgba(156,46,255,.18), 0 0 12px 1px rgba(180,92,255,.85);
    animation:pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:.65;transform:scale(.86)}
    50%{opacity:1;transform:scale(1.14)}
  }

  h2{
    margin-top:clamp(18px,3vmin,26px);
    font-size:clamp(15px,2.5vmin,23px);
    font-weight:400;
    line-height:1.5;
    color:var(--muted);
    letter-spacing:.005em;
    max-width:34ch;
    opacity:0;
    transform:translateY(14px);
    animation:rise 1.05s var(--ease) .78s forwards;
  }
  h2 b{color:#d5d5ea;font-weight:560}

  /* Feature chips */
  .chips{
    margin-top:clamp(22px,3.6vmin,32px);
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
  }
  .chip{
    font-size:clamp(10px,1.45vmin,11.5px);
    letter-spacing:.055em;
    color:#9fa0bd;
    padding:6px 12px;
    border-radius:8px;
    border:1px solid rgba(255,255,255,.07);
    background:rgba(255,255,255,.022);
    opacity:0;
    transform:translateY(12px);
    animation:rise .95s var(--ease) forwards;
  }
  .chip:nth-child(1){animation-delay:.92s}
  .chip:nth-child(2){animation-delay:1.02s}
  .chip:nth-child(3){animation-delay:1.12s}
  .chip:nth-child(4){animation-delay:1.22s}

  /* Loader */
  .loader{
    margin-top:clamp(30px,5vmin,46px);
    width:clamp(190px,30vmin,290px);
    opacity:0;
    animation:fade-in 1.2s var(--ease) 1.15s forwards;
  }
  .track{
    position:relative;
    height:2px;
    border-radius:2px;
    background:rgba(255,255,255,.07);
    overflow:hidden;
  }
  .track::after{
    content:"";
    position:absolute;
    inset:0;
    width:38%;
    border-radius:2px;
    background:linear-gradient(90deg, transparent, var(--indigo-500) 34%, var(--purple-soft) 72%, transparent);
    box-shadow:0 0 14px 1px rgba(129,140,248,.6);
    animation:slide 2.1s var(--ease) infinite;
  }
  @keyframes slide{
    0%{transform:translateX(-120%)}
    100%{transform:translateX(320%)}
  }
  .status{
    margin-top:12px;
    font-size:11px;
    letter-spacing:.13em;
    text-transform:uppercase;
    color:#63637f;
    height:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .status .txt{transition:opacity .32s ease}
  .status .txt.swap{opacity:0}

  .foot{
    position:fixed;
    bottom:20px;left:0;right:0;
    z-index:3;
    display:flex;
    justify-content:center;
    gap:18px;
    font-size:10.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:#4c4c63;
    opacity:0;
    animation:fade-in 1.4s var(--ease) 1.5s forwards;
  }
  .foot span{display:flex;align-items:center;gap:18px}
  .foot i{width:3px;height:3px;border-radius:50%;background:#33334a;font-style:normal}

  /* ── Intro / outro transitions ──────────────────────────────────── */
  @keyframes rise{
    to{opacity:1;transform:translateY(0) scale(1)}
  }
  @keyframes fade-in{to{opacity:1}}

  body.leaving .stage,
  body.leaving .foot{
    opacity:0;
    transform:scale(1.035);
    filter:blur(6px);
    transition:opacity .55s var(--ease), transform .55s var(--ease), filter .55s var(--ease);
  }
  body.leaving{background:var(--navy-900);transition:background .55s ease}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.001ms !important;
    }
    .glow,#field,.grid,.mark,h1,.badge,h2,.chip,.loader,.foot{opacity:1 !important;transform:none !important}
  }
</style>
</head>

<script>
(function(){
  "use strict";

  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ── Particle constellation ─────────────────────────────────────── */
  var cv = document.getElementById("field");
  var ctx = cv.getContext("2d");
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var nodes = [];
  var W = 0, H = 0;
  var mouse = { x: -9999, y: -9999 };

  function resize(){
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.floor(W * dpr);
    cv.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var target = Math.round(Math.min(84, Math.max(30, (W * H) / 22000)));
    nodes = [];
    for (var i = 0; i < target; i++){
      nodes.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.16,
        vy: (Math.random() - 0.5) * 0.16,
        r: Math.random() * 1.5 + 0.5,
        hue: Math.random() < 0.55 ? "129,140,248" : "156,46,255",
        a: Math.random() * 0.4 + 0.28
      });
    }
  }

  var LINK = 132;

  function frame(){
    ctx.clearRect(0, 0, W, H);

    for (var i = 0; i < nodes.length; i++){
      var n = nodes[i];
      n.x += n.vx; n.y += n.vy;
      if (n.x < -20) n.x = W + 20; else if (n.x > W + 20) n.x = -20;
      if (n.y < -20) n.y = H + 20; else if (n.y > H + 20) n.y = -20;

      var dxm = n.x - mouse.x, dym = n.y - mouse.y;
      var dm = Math.sqrt(dxm * dxm + dym * dym);
      var near = dm < 190 ? (1 - dm / 190) : 0;

      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r + near * 1.4, 0, 6.2832);
      ctx.fillStyle = "rgba(" + n.hue + "," + (n.a * (0.55 + near * 0.9)).toFixed(3) + ")";
      ctx.fill();
    }

    for (var a = 0; a < nodes.length; a++){
      for (var b = a + 1; b < nodes.length; b++){
        var p = nodes[a], q = nodes[b];
        var dx = p.x - q.x, dy = p.y - q.y;
        var d2 = dx * dx + dy * dy;
        if (d2 < LINK * LINK){
          var t = 1 - Math.sqrt(d2) / LINK;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(q.x, q.y);
          ctx.strokeStyle = "rgba(129,140,248," + (t * 0.13).toFixed(3) + ")";
          ctx.lineWidth = 0.7;
          ctx.stroke();
        }
      }
    }

    requestAnimationFrame(frame);
  }

  resize();
  window.addEventListener("resize", resize);

  if (!reduced){
    window.addEventListener("pointermove", function(e){
      mouse.x = e.clientX; mouse.y = e.clientY;
    });
    window.addEventListener("pointerleave", function(){
      mouse.x = -9999; mouse.y = -9999;
    });
    requestAnimationFrame(frame);
  } else {
    /* one static frame */
    requestAnimationFrame(function(){ frame_once(); });
    function frame_once(){
      for (var i = 0; i < nodes.length; i++){
        var n = nodes[i];
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.r, 0, 6.2832);
        ctx.fillStyle = "rgba(" + n.hue + "," + n.a.toFixed(3) + ")";
        ctx.fill();
      }
    }
  }

  /* ── Host API ───────────────────────────────────────────────────── */
  window.develcakesSplash = {
    setStatus: function(text){ /* no status element on this page */ },
    ready: function(){
      document.body.classList.add("leaving");
      setTimeout(function(){ window.dispatchEvent(new Event("splash:done")); }, 600);
    }
  };
})();
</script>
