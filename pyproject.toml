[project]
name = "crabcakes"
version = "0.1.0"
description = "GTK4 AI-native project development environment for OpenClaw"
requires-python = ">=3.11"
dependencies = [
    "PyGObject>=3.48",
    "websockets>=12.0",
    "cryptography>=41.0",
    "GitPython>=3.1",
    "tiktoken>=0.7",  # Phase CB-4: accurate token estimation for trim decisions (BUG #5 fix)
    # A-8: dependencies referenced by imported code but not previously declared
    "httpx>=0.27",        # web_fetch + Brave search (agent/tools.py)
    "PyYAML>=6.0",        # providers.yaml + agent.yaml (utils/providers_store.py, agent/config.py)
    "faster-whisper>=1.0", # STT (utils/stt.py)
    # SPEC-06 SP6 Phase 1: render-pipeline deps referenced by imported code
    "nh3>=0.3.7",         # fail-closed HTML sanitizer (render/sanitize.py)
    "pygments>=2.17.2",   # syntax highlighting (render/syntax_html.py)
    # SPEC-06 SP6 Phase 2: MCP client SDK — live production feature
    # (agent/runtime.py:818,1345; agent/tools.py:1205-1215;
    # ui/handlers/agent_runtime_handler.py:1264,1295; ui/views/agent_builder.py:637).
    # NOT the removed R5 KB stack. Floor = venv-probed version.
    "mcp>=2.2.0",         # utils/mcp_config.py + utils/mcp_client.py
]

[project.scripts]
# Console entry point — creates the `crabcakes` launcher on PATH
# (~/.local/bin for a --user install, or the venv's bin/ for a venv install).
# Target is main:main, so main.py must expose a callable main().
crabcakes = "main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68.0"]
# setuptools.build_meta is the PEP 517 backend setuptools actually ships.
# The previous value (setuptools.backends._legacy:_Backend) pointed at a
# module that does not exist, so every `pip install -e .` died at build time.
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
# Patterns are PACKAGE names, not filesystem paths. "ui/*" matched nothing
# (0 packages discovered); "ui*" matches the ui package and its subpackages
# (ui.handlers, ui.views, agent.llm, ...).
include = ["ui*", "agent*", "utils*", "models*", "prompts*", "transport*"]
