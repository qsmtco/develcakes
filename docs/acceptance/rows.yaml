# docs/acceptance/rows.yaml
# SPEC-47 §2.1 — the acceptance row registry.
#
# Each row binds ONE behavioural claim to two runnable things:
#   node      — the pytest node id or committed script that proves the claim.
#   mutation  — a diff (tests/mutations/<id>.diff) that breaks the node; the
#               MUTATED run MUST fail (a pass = vacuous = the gate refuses).
#
# Run semantics (SPEC-47 §2.3): every row runs mutated-then-clean inside a
# throwaway temp copy (`git archive HEAD` + working-tree overlay). Skip_ok
# rows tolerate a skipped clean/pytest node.
- id: R-1
  claim: "/clear durably clears: next load → None; a refused clear leaves store rows AND the in-memory conversation intact."
  source: docs/specs/SPEC-19-LIVE-CHAT-SURFACE.md §6 (clear-conversation behaviour)
  node: tests/test_live_bridge.py::test_clear_conversation_deletes_json_only
  mutation: tests/mutations/R-1.diff
  runner: xvfb
  added: 2026-10-09

- id: R-2
